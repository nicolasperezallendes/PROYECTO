<g id="Fuente"><text x="64" y="1222" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="500" fill="#718096">*2026: obras terminadas hasta la fecha del informe. Año según el estado de término informado. Además hay</text><text x="64" y="1250" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="500" fill="#718096">20 iniciativas sin año informado ($4.766 millones). Pesos nominales.</text><text x="64" y="1278" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="500" fill="#718096">Fuente: SECPLAN, Municipalidad de Coquimbo, planillas de iniciativas 2021-2026.</text></g>
