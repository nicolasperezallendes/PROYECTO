<g id="Contexto"><rect x="64" y="1128" width="952" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#F2B230" stroke-opacity="0.35"/><text x="96" y="1180" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="800" fill="#F2B230">Casa de Coquimbo Unido, campeón 2025</text><text x="96" y="1218" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600" fill="#C9D3E0">La nueva iluminación busca cumplir el estándar Conmebol</text><text x="96" y="1246" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600" fill="#C9D3E0">para recibir partidos de Copa Libertadores en Coquimbo.</text></g>
<g id="Fuente"><text x="64" y="1298" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="500" fill="#8A9BB3">Fuente: SECPLAN, Municipalidad de Coquimbo, resumen de proyectos del estadio 2023-2026. Pesos nominales.</text></g>
