<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2160" height="2700" viewBox="0 0 2160 2700">
<g id="Fondo"><rect x="0.0" y="0.0" width="2160.0" height="2700.0" rx="0" fill="#F6F4EF"/><rect x="0.0" y="0.0" width="2160.0" height="24.0" rx="0" fill="#007C99"/></g>
<g id="Titulo"><text x="130.0" y="190.0" font-family="Montserrat, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="6" fill="#007C99">COQUIMBO · 2021-2026 · ESPACIOS PÚBLICOS</text><text x="130.0" y="315.0" font-family="Montserrat, Arial, sans-serif" font-size="100" font-weight="800" fill="#0B2545">Quién financia los</text><text x="130.0" y="430.0" font-family="Montserrat, Arial, sans-serif" font-size="100" font-weight="800" fill="#0B2545">espacios públicos</text></g>
<g id="Subtitulo"><text x="130.0" y="530.0" font-family="Montserrat, Arial, sans-serif" font-size="44" font-weight="600" fill="#4A5568">$45.739 millones en 144 iniciativas, según quién pone los recursos</text></g>
<g id="Leyenda"><rect x="130.0" y="602.0" width="36.0" height="36.0" rx="7" fill="#007C99"/><text x="182.0" y="631.0" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="500" fill="#4A5568">Aporte municipal</text><rect x="540.0" y="602.0" width="36.0" height="36.0" rx="7" fill="#B0C4CE"/><text x="592.0" y="631.0" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="500" fill="#4A5568">Aporte externo</text></g>
<g id="Barras"><text x="130.0" y="740.0" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">MINVU y SERVIU</text><text x="2030.0" y="740.0" text-anchor="end" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">$19.484 millones</text><rect x="130.0" y="768.0" width="1900.0" height="46.0" rx="6" fill="#B0C4CE"/><text x="130.0" y="862.0" font-family="Montserrat, Arial, sans-serif" font-size="32" font-weight="700" fill="#4A5568">29 iniciativas con aporte · 42,6% del total</text><text x="130.0" y="906.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">Avenida Panorámica, tramo La Cantera-Los Clarines (en ejecución), Av. Costanera tramo Peñuelas Sur-cruce La Cantera,</text><text x="130.0" y="944.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">vías de evacuación de Tongoy, paseo Rengo y pavimentos participativos.</text><line x1="130" y1="970" x2="2030" y2="970" stroke="#E2DED5" stroke-width="2"/><text x="130.0" y="1032.0" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">Municipalidad de Coquimbo</text><text x="2030.0" y="1032.0" text-anchor="end" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#007C99">$15.946 millones</text><rect x="130.0" y="1060.0" width="1555.0" height="46.0" rx="6" fill="#007C99"/><text x="130.0" y="1154.0" font-family="Montserrat, Arial, sans-serif" font-size="32" font-weight="700" fill="#4A5568">104 iniciativas con aporte municipal · 34,9% del total</text><text x="130.0" y="1198.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">Parque La Pampilla, avenidas Guanaqueros (Tongoy) y Amanecer (Peñuelas), paseo peatonal de La Herradura, parque El</text><text x="130.0" y="1236.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">Bosque, piletas y obras del centro.</text><line x1="130" y1="1262" x2="2030" y2="1262" stroke="#E2DED5" stroke-width="2"/><text x="130.0" y="1324.0" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">MOP</text><text x="2030.0" y="1324.0" text-anchor="end" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">$4.393 millones</text><rect x="130.0" y="1352.0" width="428.4" height="46.0" rx="6" fill="#B0C4CE"/><text x="130.0" y="1446.0" font-family="Montserrat, Arial, sans-serif" font-size="32" font-weight="700" fill="#4A5568">3 iniciativas con aporte · 9,6% del total</text><text x="130.0" y="1490.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">Borde costero Socos en Tongoy, Av. Costanera tramo puente Culebrón-línea férrea y pavimentación del callejón</text><text x="130.0" y="1528.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">Esfuerzo Campesino (Vialidad).</text><line x1="130" y1="1554" x2="2030" y2="1554" stroke="#E2DED5" stroke-width="2"/><text x="130.0" y="1616.0" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">Gobierno Regional</text><text x="2030.0" y="1616.0" text-anchor="end" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">$3.112 millones</text><rect x="130.0" y="1644.0" width="303.4" height="46.0" rx="6" fill="#B0C4CE"/><text x="130.0" y="1738.0" font-family="Montserrat, Arial, sans-serif" font-size="32" font-weight="700" fill="#4A5568">11 iniciativas con aporte · 6,8% del total</text><text x="130.0" y="1782.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">Cuartel de la 1ª Compañía de Bomberos de Sindempart, camión cama baja para caminos rurales, conservación de</text><text x="130.0" y="1820.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">pavimentos, apoyo por escasez hídrica y plaza memorial ferroviario.</text><line x1="130" y1="1846" x2="2030" y2="1846" stroke="#E2DED5" stroke-width="2"/><text x="130.0" y="1908.0" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">SUBDERE</text><text x="2030.0" y="1908.0" text-anchor="end" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">$2.707 millones</text><rect x="130.0" y="1936.0" width="264.0" height="46.0" rx="6" fill="#B0C4CE"/><text x="130.0" y="2030.0" font-family="Montserrat, Arial, sans-serif" font-size="32" font-weight="700" fill="#4A5568">24 iniciativas con aporte · 5,9% del total</text><text x="130.0" y="2074.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">Muchas obras de barrio de menor tamaño: redes sanitarias en El Peñón y El Sauce, pasajes y calles de Guayacán, plazas,</text><text x="130.0" y="2112.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">sedes y cámaras de televigilancia.</text><line x1="130" y1="2138" x2="2030" y2="2138" stroke="#E2DED5" stroke-width="2"/><text x="130.0" y="2200.0" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">Min. de las Culturas y Prevención del Delito</text><text x="2030.0" y="2200.0" text-anchor="end" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#0B2545">$98 millones</text><rect x="130.0" y="2228.0" width="9.6" height="46.0" rx="6" fill="#B0C4CE"/><text x="130.0" y="2322.0" font-family="Montserrat, Arial, sans-serif" font-size="32" font-weight="700" fill="#4A5568">3 iniciativas con aporte · 0,2% del total</text><text x="130.0" y="2366.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">Casa del arte rural de La Cantera (Culturas) y área de juegos de la plaza Pescadores de Guayacán (Prevención del</text><text x="130.0" y="2404.0" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="500" fill="#718096">Delito).</text></g>
<g id="Notas"><text x="130.0" y="2500.0" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="500" fill="#718096">Una iniciativa puede tener aporte municipal y externo a la vez. Incluye obras terminadas, en curso y sin estado.</text><text x="130.0" y="2544.0" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="500" fill="#718096">Pesos nominales. Fuente: SECPLAN, Municipalidad de Coquimbo, planillas de iniciativas 2021-2026.</text></g>

</svg>
