<g id="Notas"><text x="130.0" y="2440.0" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="500" fill="#718096">*2026: obras terminadas hasta la fecha del informe. El año es el de término que informa la planilla.</text><text x="130.0" y="2484.0" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="500" fill="#718096">"En curso": obras en ejecución; su monto es comprometido. "Sin año": sin estado informado.</text><text x="130.0" y="2528.0" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="500" fill="#718096">Las barras con trama aún no están terminadas. Pesos nominales.</text><text x="130.0" y="2572.0" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="500" fill="#718096">Fuente: SECPLAN, Municipalidad de Coquimbo, planillas de iniciativas 2021-2026.</text></g>

